name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # sqlx::migrate! isn't tracked as a source dependency; a restored cache can
      # embed stale migrations, breaking tests that exercise the schema.
      - name: Force fresh embedded migrations
        run: cargo clean -p turaes-core
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Frontend syntax check
        run: sh scripts/check-js.sh
      - name: Frontend tests
        run: node --test tests/frontend/*.test.mjs
      - name: Cert automation check
        run: make certs-check

  # The Pingora data plane is Linux tier-1; requires OpenSSL dev headers and
  # cmake (for libz-ng-sys). Now a required gate (M2 shipped).
  proxy:
    name: proxy (pingora feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang perl pkg-config libssl-dev cmake
      - name: Check proxy
        run: cargo check -p turaes-proxy --features pingora
