name: Secrets

# Backstop secret scan for the public repo. GitHub's built-in secret scanning
# also runs on public repos; this gate fails CI before a leaked secret merges.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
