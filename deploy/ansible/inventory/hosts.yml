---
# Fleet inventory. One control plane, any number of workers (agents) and edges.
# `ansible_ssh_private_key_file` must point at keys outside this repo — never
# put passwords here. Group names are referenced by the playbooks:
#   control  -> playbooks/provision.yml, playbooks/join.yml
#   workers  -> playbooks/agent.yml
#   edges    -> playbooks/edge.yml
#
# Workers need two extra host_vars used by the control-plane SSH bootstrap:
#   turaes_node_name       unique node name (agent identity / server row)
#   turaes_node_address    private VPC IP; advertised to control and used as
#                          the SSH host unless turaes_node_ssh_host is set
#   turaes_node_ssh_user   default root (the bootstrap script needs root)

all:
  children:
    control:
      hosts:
        turaes-vps:
          ansible_host: 43.173.9.225
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/turaes-vps
    workers:
      hosts:
        worker-1:
          ansible_host: 10.0.0.9
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/worker-1
          turaes_node_name: worker-1
          turaes_node_address: 10.0.0.9
          turaes_node_ssh_user: root
    edges:
      hosts:
        edge-1:
          ansible_host: 10.0.0.3
          ansible_user: ansible
          ansible_ssh_private_key_file: ~/.ssh/edge-1
