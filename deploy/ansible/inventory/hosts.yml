---
# Single VPS running the turaes control plane with the embedded Pingora proxy.
# Point `ansible_ssh_private_key_file` at a key outside this repo — never put
# passwords here (use SSH keys + the ansible user's authorized_keys).
all:
  hosts:
    turaes-vps:
      ansible_host: 43.173.9.225
      ansible_user: ansible
      ansible_ssh_private_key_file: ~/.ssh/turaes-vps
