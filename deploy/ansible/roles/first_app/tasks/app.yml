---
# The `turaes` CLI on the control plane reads config from `TURAES_*` env vars
# only (the systemd unit's EnvironmentFile is not inherited by a shell). Source
# /etc/turaes/turaes.env so apply/deploy hit the right DB and sealing key.
- name: Read the control-plane env for CLI invocations
  ansible.builtin.slurp:
    src: "{{ turaes_env_file }}"
  register: first_app_cli_env_slurp

- name: Parse the env file into the CLI process environment
  ansible.builtin.set_fact:
    first_app_cli_env: >-
      {{ dict(first_app_cli_env_slurp.content | b64decode
         | regex_findall('^([A-Za-z_][A-Za-z0-9_]*)=(.*)$', multiline=True)) }}
  no_log: true

- name: Ensure the app binary exists
  ansible.builtin.assert:
    that:
      - turaes_first_app_name is defined and turaes_first_app_name | length > 0
    msg: turaes_first_app_name is empty — set it or skip this role with --skip-tags first-app

- name: Upload the app binary when a local source is provided
  ansible.builtin.copy:
    src: "{{ turaes_first_app_upload_src }}"
    dest: "{{ turaes_first_app_binary }}"
    remote_src: false
    mode: "0755"
  when:
    - turaes_first_app_upload_src is defined
    - turaes_first_app_upload_src | length > 0

- name: Stat the app binary
  ansible.builtin.stat:
    path: "{{ turaes_first_app_binary }}"
  register: first_app_bin_stat

- name: Assert the app binary is on the box
  ansible.builtin.assert:
    that:
      - first_app_bin_stat.stat.exists
    msg: >-
      The first-app binary {{ turaes_first_app_binary }} does not exist. Build
      it on the server (or set turaes_first_app_upload_src to a local path).

- name: Create the app manifest directory
  ansible.builtin.file:
    path: "{{ turaes_config_dir }}/apps"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the app manifest
  ansible.builtin.template:
    src: app.yaml.j2
    dest: "{{ turaes_config_dir }}/apps/{{ turaes_first_app_name }}.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Apply the manifest (idempotent create-or-update)
  ansible.builtin.command: turaes apply -f "{{ turaes_config_dir }}/apps/{{ turaes_first_app_name }}.yaml"
  environment: "{{ first_app_cli_env }}"
  changed_when: false
  failed_when: false
  no_log: true

- name: Check whether any slot is already running
  ansible.builtin.command: systemctl is-active "{{ turaes_first_app_name }}-a" "{{ turaes_first_app_name }}-b"
  register: first_app_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Deploy the first app (blue/green, health-gated)
  ansible.builtin.command: turaes app deploy "{{ turaes_first_app_name }}"
  environment: "{{ first_app_cli_env }}"
  register: first_app_deploy
  changed_when: "'deployed' in first_app_deploy.stdout"
  no_log: true
  when: first_app_active.rc != 0
