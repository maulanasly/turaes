<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>turaes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/turaes-icon-light-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/turaes-icon-dark-16.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/turaes-icon-light-16.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/turaes-icon-dark-32.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/turaes-icon-light-32.png" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="48x48" href="/brand/turaes-icon-dark-48.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="48x48" href="/brand/turaes-icon-light-48.png" media="(prefers-color-scheme: light)" />
  <link rel="apple-touch-icon" href="/brand/turaes-icon-light-192.png" />
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
  <script>
    try {
      var t = localStorage.getItem("turaes-theme") ||
        (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "preact": "/js/vendor/preact.module.js",
        "preact/hooks": "/js/vendor/hooks.module.js",
        "htm": "/js/vendor/htm.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>turaes requires JavaScript.</noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
