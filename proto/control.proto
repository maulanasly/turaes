// Control-plane <-> agent channel (N1b/N1c).
//
// The agent dials the control plane outbound (NAT-friendly), registers with a
// join token, heartbeats, polls desired state, and reports apply status.
// Artifacts are fetched over HTTP (`/agent/artifacts/{hash}`) with the agent
// token. The separate edge role lands in N3.
syntax = "proto3";

package turaes.v1;

service Control {
  // Exchange a join token for a server-bound agent token.
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Liveness / last-seen.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // Fetch the desired apps for this node.
  rpc Poll(PollRequest) returns (PollResponse);
  // Report an apply result back to the control plane.
  rpc Report(ReportRequest) returns (ReportResponse);
  // Push per-app resource + visitor metrics.
  rpc PushMetrics(MetricsRequest) returns (MetricsResponse);
  // Edge role: fetch the current route table (host -> backend).
  rpc EdgeRoutes(EdgeRoutesRequest) returns (EdgeRoutesResponse);
  // Edge role: fetch certificate material per host.
  rpc EdgeCerts(EdgeCertsRequest) returns (EdgeCertsResponse);
}

message EdgeCertsRequest {
  string token = 1;
}

message EdgeCert {
  string host = 1;
  bytes fullchain_pem = 2;
  bytes privkey_pem = 3;
}

message EdgeCertsResponse {
  repeated EdgeCert certs = 1;
}

message EdgeRoutesRequest {
  string token = 1;
}

message EdgeRoute {
  string host = 1;
  string address = 2;
  uint32 port = 3;
  bool tls = 4;
}

message EdgeRoutesResponse {
  repeated EdgeRoute routes = 1;
}

message RegisterRequest {
  string join_token = 1;
  string name = 2;
  string address = 3;
  string version = 4;
}

message RegisterResponse {
  string server_id = 1;
  string agent_token = 2;
}

message HeartbeatRequest {
  string agent_token = 1;
}

message HeartbeatResponse {
  bool ok = 1;
  string server_id = 2;
}

message PollRequest {
  string agent_token = 1;
}

message DesiredApp {
  string name = 1;
  string artifact_hash = 2;
  string args = 3;
  uint32 port = 4;
  string runtime = 5;
  string health_path = 6;
  string metrics_path = 7;
  map<string, string> env = 8;
}

message PollResponse {
  repeated DesiredApp apps = 1;
}

message ReportRequest {
  string agent_token = 1;
  string app_name = 2;
  // "running" | "failed" | "stopped"
  string status = 3;
  string artifact_hash = 4;
  string message = 5;
}

message ReportResponse {
  bool ok = 1;
}

message RegionVisits {
  string region = 1;
  int64 visits = 2;
  int64 uniques = 3;
}

message AppMetrics {
  string app_name = 1;
  double cpu_pct = 2;
  uint64 mem_bytes = 3;
  repeated RegionVisits visits = 4;
}

message MetricsRequest {
  string agent_token = 1;
  repeated AppMetrics apps = 2;
}

message MetricsResponse {
  bool ok = 1;
}
